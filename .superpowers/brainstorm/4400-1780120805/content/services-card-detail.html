<h2>双层卡片样式详解</h2>
<p class="subtitle">以下是双层卡片的两种变体，点击选择你喜欢的风格</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 20px; background: #0a0e14;">
      <div style="background: rgba(13,17,23,0.7); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden;">
        <!-- 上层：信息区 -->
        <div style="padding: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, rgba(63,185,80,0.18), rgba(63,185,80,0.06)); display: flex; align-items: center; justify-content: center; color: #7ee787; font-size: 22px;">🔗</div>
              <div>
                <div style="color: #e6edf3; font-weight: 700; font-size: 16px; margin-bottom: 4px;">Jenkins CI/CD</div>
                <div style="color: #8b949e; font-size: 13px;">CI/CD 持续集成与持续部署平台</div>
              </div>
            </div>
            <span style="background: rgba(63,185,80,0.2); color: #7ee787; font-size: 11px; padding: 4px 10px; border-radius: 6px;">在线</span>
          </div>
        </div>
        <!-- 下层：地址区 -->
        <div style="background: rgba(255,255,255,0.03); border-top: 1px solid rgba(255,255,255,0.06); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: rgba(255,255,255,0.05); color: #6e7681; font-size: 10px; padding: 3px 8px; border-radius: 4px;">DevOps</span>
            <span style="color: #8b949e; font-size: 12px; font-family: monospace;">192.168.1.100:8080</span>
          </div>
          <div style="background: rgba(88,166,255,0.15); border: 1px solid rgba(88,166,255,0.3); border-radius: 8px; padding: 8px 16px; color: #79c0ff; font-size: 12px; cursor: pointer;">访问 →</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 深色双层卡片</h3>
      <p>上层信息区 + 下层地址/访问区，中间有分割线</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 20px; background: #f6f8fa;">
      <div style="background: #fff; border: 1px solid #d0d7de; border-radius: 12px; overflow: hidden;">
        <!-- 上层：信息区 -->
        <div style="padding: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(26,127,55,0.1); display: flex; align-items: center; justify-content: center; color: #1a7f37; font-size: 22px;">🔗</div>
              <div>
                <div style="color: #1f2328; font-weight: 700; font-size: 16px; margin-bottom: 4px;">Jenkins CI/CD</div>
                <div style="color: #656d76; font-size: 13px;">CI/CD 持续集成与持续部署平台</div>
              </div>
            </div>
            <span style="background: rgba(26,127,55,0.15); color: #1a7f37; font-size: 11px; padding: 4px 10px; border-radius: 6px;">在线</span>
          </div>
        </div>
        <!-- 下层：地址区 -->
        <div style="background: #f6f8fa; border-top: 1px solid #d0d7de; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: #e8ecf0; color: #656d76; font-size: 10px; padding: 3px 8px; border-radius: 4px;">DevOps</span>
            <span style="color: #8b949e; font-size: 12px; font-family: monospace;">192.168.1.100:8080</span>
          </div>
          <div style="background: #0969da; color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 12px; cursor: pointer;">访问 →</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 浅色双层卡片</h3>
      <p>白色背景 + 灰色下层，访问按钮为实心蓝色</p>
    </div>
  </div>
</div>
