<h2>首页卡片 UI 优化方案</h2>
<p class="subtitle">以下是 3 种不同的卡片设计方向，点击选择你喜欢的风格</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>毛玻璃卡片</h3>
      <p>半透明背景 + backdrop-filter 模糊效果，悬浮时有微妙的光晕和边框高亮</p>
      <ul>
        <li>现代感强，层次分明</li>
        <li>适合深色主题</li>
        <li>性能消耗略高</li>
      </ul>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>渐变边框卡片</h3>
      <p>深色背景 + 渐变色边框，悬浮时边框发光扩散</p>
      <ul>
        <li>视觉冲击力强</li>
        <li>每个卡片有独特配色</li>
        <li>交互反馈清晰</li>
      </ul>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>简约扁平卡片</h3>
      <p>纯色背景 + 细边框，悬浮时轻微上浮和阴影变化</p>
      <ul>
        <li>简洁清爽</li>
        <li>性能最优</li>
        <li>适配性最好</li>
      </ul>
    </div>
  </div>
</div>
