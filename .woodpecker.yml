steps:
  - name: build
    image: node:22
    commands:
      - npm ci
      - npm run build
    when:
      branch: hxc
      event: push

  - name: deploy
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/opshub:/data/opshub
    commands:
      - cp -r dist/. /data/opshub/dist/
      - cp -r server/. /data/opshub/server/
      - cp package.json package-lock.json /data/opshub/
      - docker restart opshub-api
      - docker exec opshub-nginx nginx -s reload
    when:
      branch: hxc
      event: push

